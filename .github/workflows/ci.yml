name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux X11/Wayland & Vulkan headers for eframe/wgpu
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libvulkan-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check workspace compilation
        run: cargo check --workspace --all-targets
      - name: Run sar-core & sar-app release unit tests
        run: cargo test --workspace --release
      - name: Smoke-test CLI subcommands (SMARTS, Free-Wilson R-Group, SALI Cliffs, MMP, Benchmark)
        run: |
          cargo run --release -- smarts --pattern "c1ncnc2ccccc12" --input data/benchmark_26.sdf
          cargo run --release -- rgroup --input data/benchmark_26.sdf --slots 3
          cargo run --release -- cliffs --input data/benchmark_26.sdf --top 10
          cargo run --release -- mmp --input data/benchmark_26.csv --top 10
          cargo run --release -- bench --compounds 5000
          cargo run --release -- macrocycle --id CHEMBL553
          cargo run --release -- frag-grow --seed RO3-7AZA
          cargo run --release -- prodrug --archetype ARC-OSLT
          cargo run --release -- pbpk --id CHEMBL54
