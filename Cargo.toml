[workspace]
resolver = "2"
members = [
    "crates/sar-core",
    "crates/sar-app",
]

[workspace.package]
version = "3.8.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Bryan P. White <bryan@crvscience.com>"]

[workspace.dependencies]
sar-core = { path = "crates/sar-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytemuck = { version = "1.19", features = ["derive"] }
rayon = "1.10"
thiserror = "2.0"
ureq = { version = "2.10", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
png = "0.18"
rfd = "0.15"
eframe = { version = "0.31", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
